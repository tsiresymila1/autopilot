<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="autopilot logo">
  <defs>
    <linearGradient id="ap-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="ap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#ap-bg)"/>

  <!-- flight path: a dotted arc the plane is flying along -->
  <path d="M56 176 C 92 168, 120 150, 176 92"
        stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- paper plane (autopilot flies itself) -->
  <g filter="url(#ap-shadow)">
    <path d="M196 60 L108 108 L142 124 Z" fill="#FFFFFF"/>
    <path d="M196 60 L142 124 L138 176 L120 132 Z" fill="#E9E6FF"/>
  </g>

  <!-- gate passed / done -->
  <circle cx="188" cy="186" r="26" fill="#34D399"/>
  <path d="M176 187 l8 8 l16 -18" stroke="#04361F" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
